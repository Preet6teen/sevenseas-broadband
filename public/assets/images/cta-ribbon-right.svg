<svg width="420" height="420" viewBox="0 0 420 420" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="rightRibbonGrad" x1="400" y1="410" x2="20" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="32%" stop-color="#6D28D9" />
      <stop offset="68%" stop-color="#9333EA" />
      <stop offset="90%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <linearGradient id="rightHighlight" x1="390" y1="390" x2="80" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#DDD6FE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0" />
    </linearGradient>
    <filter id="rightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="8" dy="16" stdDeviation="24" flood-color="#6366F1" flood-opacity="0.24" />
    </filter>
  </defs>
  <!-- Inverted curved arch opening downward -->
  <path d="M 420 420 C 400 210, 290 40, 120 40 C 40 40, 0 100, 0 160 C 30 130, 80 110, 140 110 C 250 110, 330 230, 345 420 Z" 
        fill="url(#rightRibbonGrad)" filter="url(#rightGlow)" />
  <!-- Dimensional specular highlight -->
  <path d="M 412 410 C 392 220, 282 55, 125 55 C 55 55, 18 108, 12 150" 
        stroke="url(#rightHighlight)" stroke-width="5" stroke-linecap="round" fill="none" />
</svg>