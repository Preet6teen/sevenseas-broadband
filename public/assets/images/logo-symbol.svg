<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" role="img" aria-label="Sevenseas Broadband Symbol">
  <defs>
    <!-- Subtle drop shadow for crisp rendering at tiny favicon sizes -->
    <filter id="symbolShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3050" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Outer Navy Ring Badge -->
  <circle cx="132" cy="124" r="88" fill="none" stroke="#1E3050" stroke-width="22" filter="url(#symbolShadow)" />
  
  <!-- Orange Transmitter Beacon / Dot -->
  <circle cx="72" cy="204" r="14" fill="#F57C00" />
  
  <!-- Radiating Orange Signal Arcs (#F57C00) -->
  <path d="M 108 166 A 32 32 0 0 1 140 134" fill="none" stroke="#F57C00" stroke-width="11" stroke-linecap="round" />
  <path d="M 102 144 A 55 55 0 0 1 156 110" fill="none" stroke="#F57C00" stroke-width="12" stroke-linecap="round" />
  <path d="M 98 120 A 80 80 0 0 1 172 84" fill="none" stroke="#F57C00" stroke-width="12.5" stroke-linecap="round" />
  <path d="M 96 94 A 106 106 0 0 1 188 58" fill="none" stroke="#F57C00" stroke-width="13" stroke-linecap="round" />
</svg>