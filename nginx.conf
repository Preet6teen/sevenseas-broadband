# Sevenseas Broadband — Production Nginx Configuration Snippet
server {
    listen 80;
    listen [::]:80;
    server_name sevenseasbroadband.in www.sevenseasbroadband.in;
    
    # 301 Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sevenseasbroadband.in www.sevenseasbroadband.in;

    root /var/www/sevenseasbroadband;
    index index.html;

    # SSL hardening
    ssl_certificate /etc/letsencrypt/live/sevenseasbroadband.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sevenseasbroadband.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Deny access to sensitive directories
    location ~ ^/(data|config|server|\.git) {
        deny all;
        return 404;
    }

    # Static assets caching
    location ~* \.(css|js|svg|jpg|jpeg|png|webp|avif|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
