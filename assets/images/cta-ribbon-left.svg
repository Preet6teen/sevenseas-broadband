<svg width="420" height="420" viewBox="0 0 420 420" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="leftRibbonGrad" x1="20" y1="10" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="28%" stop-color="#7C3AED" />
      <stop offset="65%" stop-color="#A855F7" />
      <stop offset="92%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>
    <linearGradient id="leftHighlight" x1="40" y1="10" x2="340" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="45%" stop-color="#DDD6FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>
    <filter id="leftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="14" stdDeviation="22" flood-color="#7C3AED" flood-opacity="0.24" />
    </filter>
  </defs>
  <!-- Lower circular ribbon opening upward -->
  <path d="M 15 0 C 35 220, 160 380, 320 380 C 390 380, 420 325, 420 260 C 385 285, 345 305, 295 305 C 175 305, 95 190, 85 0 Z" 
        fill="url(#leftRibbonGrad)" filter="url(#leftGlow)" />
  <!-- Dimensional specular highlight -->
  <path d="M 22 5 C 42 205, 162 365, 312 365 C 375 365, 405 315, 410 270" 
        stroke="url(#leftHighlight)" stroke-width="5" stroke-linecap="round" fill="none" />
</svg>