<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" role="img" aria-label="Whole-Home Gigabit Wi-Fi 6 Mesh Coverage Diagram">
  <defs>
    <radialGradient id="meshWaveGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F57C00" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#F57C00" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F57C00" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="secondaryWaveGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F9D75" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F9D75" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="400" height="240" rx="12" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1.5" />

  <!-- Floorplan Layout Silhouettes -->
  <!-- Living Room -->
  <rect x="30" y="30" width="160" height="180" rx="8" fill="#F7F8FC" stroke="#E3E8F0" stroke-width="1" />
  <text x="45" y="52" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#5B6B82">Living &amp; Entertainment</text>
  
  <!-- Study / Home Office -->
  <rect x="200" y="30" width="170" height="85" rx="8" fill="#F7F8FC" stroke="#E3E8F0" stroke-width="1" />
  <text x="215" y="52" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#5B6B82">Home Office / Study</text>

  <!-- Master Bedroom -->
  <rect x="200" y="125" width="170" height="85" rx="8" fill="#F7F8FC" stroke="#E3E8F0" stroke-width="1" />
  <text x="215" y="147" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#5B6B82">Bedroom &amp; Balcony</text>

  <!-- Main Router Node (Living Room) -->
  <circle cx="110" cy="120" r="85" fill="url(#meshWaveGrad)" />
  <circle cx="110" cy="120" r="55" fill="none" stroke="#F57C00" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="110" cy="120" r="14" fill="#1E3050" />
  <circle cx="110" cy="120" r="5" fill="#F57C00" />
  <text x="75" y="155" font-family="'Manrope', sans-serif" font-size="10" font-weight="800" fill="#1E3050">WiFi 6 Primary</text>

  <!-- Mesh Extender Node (Study Room) -->
  <circle cx="285" cy="72" r="55" fill="url(#secondaryWaveGrad)" />
  <circle cx="285" cy="72" r="35" fill="none" stroke="#0F9D75" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="285" cy="72" r="10" fill="#0F9D75" />
  <circle cx="285" cy="72" r="3.5" fill="#FFFFFF" />
  <text x="250" y="98" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" fill="#0B7A5C">Mesh Node</text>

  <!-- Seamless Optical Backhaul line -->
  <path d="M 110 120 C 180 120, 220 72, 285 72" fill="none" stroke="#F57C00" stroke-width="2" stroke-linecap="round" />

  <!-- Zero Dead Zones Pill -->
  <rect x="250" y="172" width="115" height="26" rx="13" fill="#E6F6F0" stroke="rgba(15, 157, 117, 0.3)" />
  <text x="265" y="189" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#0B7A5C">Zero Dead Zones</text>
</svg>